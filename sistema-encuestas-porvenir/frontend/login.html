<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/icono-192.png">
    <link rel="icon" type="image/png" href="./assets/icono-192.png">
    <title>El Porvenir Opina · Acceso</title>
    <link rel="stylesheet" href="style.css?v=7">
    <script src="registrar-sw.js"></script>
</head>
<body>
    <div class="pagina-login">
        <div class="login-card">
            <img src="./assets/icono-512.png" alt="El Porvenir Opina" class="inicio-logo-img" style="width:64px;height:64px;">
            <h2 id="titulo-login">Iniciar Sesión</h2>
            <p class="login-sub" id="subtitulo-login">Encuestador · Personal de campo</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="usuario@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>

                <button type="submit" id="btn-accion" class="btn btn-primario">Ingresar</button>
            </form>

            <div class="login-enlace" id="zona-registro">
                <button id="btn-cambiar-modo">¿No tienes cuenta? Regístrate aquí</button>
            </div>

            <div class="aviso-admin" id="aviso-admin" style="display:none;">
                Las cuentas de administrador se asignan desde la jefatura del sistema.
                Si eres administrador y aún no tienes acceso, contacta al responsable del proyecto.
            </div>

            <p class="login-enlace">
                <a href="index.html">← Volver a selección de roles</a>
            </p>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
